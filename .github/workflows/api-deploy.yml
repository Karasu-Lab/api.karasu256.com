name: API Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Deployment itself lives in Karasu-Lab/WorkersDeploy: it deploys this
# app standalone from this repository, detects the ElysiaJS project,
# builds it with Vite, and deploys it to Cloudflare Workers.

jobs:
  deploy:
    if: github.ref_name == 'main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: production
          worker-name: api-karasu256-com
          secret-names: DATABASE_URL INTERNAL_API_SECRET VERCEL_PROTECTION_BYPASS_SECRET FIREBASE_ADMIN_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY

  preview:
    if: github.ref_name != 'main'
    environment: preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ vars.GOOGLE_CLOUD_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ vars.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
    steps:
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v1
        with:
          mode: preview
          worker-name: api-karasu256-com
          secret-names: DATABASE_URL INTERNAL_API_SECRET VERCEL_PROTECTION_BYPASS_SECRET FIREBASE_ADMIN_PROJECT_ID FIREBASE_ADMIN_CLIENT_EMAIL FIREBASE_ADMIN_PRIVATE_KEY
          preview-args: --var GIT_BRANCH:{branch}
