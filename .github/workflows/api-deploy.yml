# Moved from Karasu-Lab/karasu256.com/.github/workflows/api-deploy.yml.
# This app depends on workspace packages, so the deploy still builds in
# the hub repository's tree: this workflow clones the hub (with its
# submodules) and pins this app's submodule to the commit that triggered
# the run. It requires the hub's main branch to carry the submodule
# layout, and this repository to hold the Actions secrets and variables
# referenced below under the same names.
name: api.karasu256.com Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Assemble the workspace from the hub repository
        run: |
          git clone --recurse-submodules --branch main https://github.com/Karasu-Lab/karasu256.com.git .
          git -C apps/api.karasu256.com fetch origin "${{ github.sha }}"
          git -C apps/api.karasu256.com checkout --detach "${{ github.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to production
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter api.karasu256.com deploy

      - name: Sync worker secrets
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/api.karasu256.com "$RUNNER_TEMP/api-secrets.json" DATABASE_URL INTERNAL_API_SECRET VERCEL_PROTECTION_BYPASS_SECRET
          pnpm --filter api.karasu256.com exec wrangler secret bulk "$RUNNER_TEMP/api-secrets.json"

      - name: Create or update the branch preview
        if: github.ref_name != 'main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.PREVIEW_INTERNAL_API_SECRET }}
          VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.PREVIEW_VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          node .github/scripts/worker-secrets-file.mjs apps/api.karasu256.com "$RUNNER_TEMP/api-preview-secrets.json" DATABASE_URL INTERNAL_API_SECRET VERCEL_PROTECTION_BYPASS_SECRET
          pnpm --filter api.karasu256.com preview -- --name "${{ github.ref_name }}" --var "GIT_BRANCH:${{ github.ref_name }}" --secrets-file "$RUNNER_TEMP/api-preview-secrets.json"
