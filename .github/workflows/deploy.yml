name: API Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  deploy:
    environment: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: github.ref_name == github.event.repository.default_branch
      - name: Apply D1 migrations
        if: github.ref_name == github.event.repository.default_branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx --yes wrangler@4 d1 migrations apply CDN_DB --remote
      - name: Deploy the worker
        uses: Karasu-Lab/WorkersDeploy@v3
        with:
          exclude: CLOUDFLARE_D1_API_TOKEN
          vars-json: ${{ toJSON(vars) }}
          secrets-json: ${{ toJSON(secrets) }}
